<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>가상 클래스 실습</title>
  <link rel="stylesheet" href="vrstyle.css">
</head>
<body>

  <!-- hover / active / focus / disabled -->
  <a href="#">링크 (hover 시 빨간색)</a>
  <button>버튼 (클릭 시 축소)</button>
  <input type="text" placeholder="포커스 시 파란 외곽선">
  <input type="text" placeholder="비활성" disabled>

  <!-- nth-child / first-child / last-child -->
  <ul>
    <li>첫 번째 — bold (first-child)</li>
    <li>두 번째</li>
    <li>세 번째 — 홀수 회색 배경 (nth-child(odd))</li>
    <li>마지막 — border 없음 (last-child)</li>
  </ul>

  <!-- 폼 상태 / not() -->
  <form>
    <input type="email" required placeholder="required (빨간 왼쪽 선)">
    <p class="intro">not(.intro) 적용 안 됨 — 들여쓰기 없음</p>
    <p>not(.intro) 적용 — 들여쓰기 있음</p>
  </form>

</body>
</html>
