<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>폰트 실습</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700
        &family=Black+Han+Sans&display=swap" rel="stylesheet">
  <style>
    body  { font-family: 'Noto Sans KR', sans-serif; padding: 24px; }
    .title { font-family: 'Black Han Sans', sans-serif;
             font-size: 2.5rem; letter-spacing: 0.05em; }
    .body-text { font-size: 1rem; line-height: 1.8; }
    .muted { color: #888; text-decoration: underline; }
    .caps  { text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <p class="title">Black Han Sans 타이틀</p>
  <p class="body-text">Noto Sans KR — 본문용 폰트. line-height: 1.8로 여유 있게.</p>
  <p class="muted">text-decoration: underline 적용</p>
  <p class="caps">text-transform uppercase</p>
</body>
</html>
