<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그</title>
</head>
<body>
    <script>
        // console.log(): 콘솔에 값 출력 (개발 시 가장 많이 씀)
        console.log('Hello, JavaScript!');
        console.log(42);
        console.log(true);

        // console.error(): 빨간색 오류 메시지
        console.error('오류가 발생했습니다!');

        // console.warn(): 노란색 경고 메시지
        console.warn('이 기능은 곧 삭제될 예정입니다.');

        // console.table(): 배열/객체를 표 형태로 출력
        console.table([{ name: '홍길동', age: 25 }, { name: '김개발', age: 30 }]);
    </script>
</body>
</html>
