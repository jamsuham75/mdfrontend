<!DOCTYPE html>
<html lang="en">
<body>
    <script>
        // 조건 ? 참일 때 값 : 거짓일 때 값
        const age = 20;
        const status = age >= 18 ? '성인' : '미성년자';
        console.log(status);  // '성인'

        // if/else를 한 줄로 표현 (간단한 조건에 적합)
        const score = 85;
        const grade = score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : 'F';
        console.log(grade);  // 'B'
        // 단, 중첩 삼항은 가독성이 나빠지므로 2단계 이상은 if/else 사용 권장
    </script>
</body>
</html>
