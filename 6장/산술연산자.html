<!DOCTYPE html>
<html lang="en">
<body>
    <script>
        console.log(10 + 3);   // 13  덧셈
        console.log(10 - 3);   // 7   뺄셈
        console.log(10 * 3);   // 30  곱셈
        console.log(10 / 3);   // 3.333... 나눗셈
        console.log(10 % 3);   // 1   나머지 (모듈로)
        console.log(2 ** 10);  // 1024 거듭제곱

        // 증감 연산자
        let count = 5;
        console.log(count++);   // count = count + 1 → 6
        console.log(count--);   // count = count - 1 → 5
        console.log(++count);   // 전위: 먼저 증가 후 반환
        console.log(count++);   // 후위: 먼저 반환 후 증가

        // 나머지(%) 연산자 활용 예
        console.log(7 % 2);  // 1 → 홀수/짝수 판별에 활용
        console.log(8 % 2);  // 0 → 0이면 짝수
        console.log(13 % 12); // 1 → 시계 계산에 활용 (12시간 후 = 1시)
    </script>
</body>
</html>
