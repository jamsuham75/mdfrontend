<!DOCTYPE html>
<html lang="en">
<body>
    <script>
        const day = new Date().getDay(); // 0: 일요일, 1: 월요일 ... 6: 토요일
        switch (day) {
        case 0:
            console.log('일요일 — 휴식!');
            break;
        case 1:
            console.log('월요일 — 새로운 시작!');
            break;
        case 6:
            console.log('토요일 — 주말!');
            break;
        default:
            console.log('평일 — 열심히!');
        }
        // break 없으면 다음 case로 계속 실행됨 (fall-through) — 의도적 사용 외엔 주의!

        // 여러 case를 같은 블록으로 처리
        switch (day) {
        case 0:
        case 6:
            console.log('주말');  // 0 또는 6이면 실행
            break;
        default:
            console.log('평일');
        }
    </script>
</body>
</html>
