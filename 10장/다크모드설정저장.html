<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다크모드 저장</title>
  <style>
    :root { --bg: #ffffff; --text: #333; --card: #f5f5f5; }
    [data-theme="dark"] { --bg: #1a1a2e; --text: #e0e0e0; --card: #2d2d44; }
    * { box-sizing: border-box; margin: 0; padding: 0; transition: 0.3s; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text);
           min-height: 100vh; padding: 24px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px;
            margin-bottom: 12px; }
    button { padding: 10px 20px; background: #5c6bc0; color: white;
             border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>다크모드 설정 저장</h1>
  <div class="card">
    <p>모드를 전환하고 페이지를 새로고침해도 설정이 유지됩니다.</p>
  </div>
  <button id="toggle">🌙 모드 전환</button>

  <script>
    // ① 페이지 로드 시 저장된 테마 적용
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.dataset.theme = saved;

    // ② 버튼 클릭 시 테마 변경 + 저장
    document.getElementById('toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const current = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = current;
      localStorage.setItem('theme', current);
    });
  </script>
</body>
</html>
