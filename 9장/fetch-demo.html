<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>fetch API 실습</title>
  <style>
    body { font-family: sans-serif; padding: 24px; max-width: 700px; }
    button { padding: 10px 20px; background: #2E75B6; color: white;
             border: none; border-radius: 6px; cursor: pointer;
             font-size: 1rem; margin-bottom: 16px; }
    button:disabled { opacity: 0.5; }
    .user { padding: 12px 16px; background: #f5f5f5;
            border-radius: 8px; margin-bottom: 8px; }
    .name  { font-weight: 700; color: #2E75B6; }
    .email { font-size: 0.9rem; color: #666; }
    .loading, .error { padding: 16px; border-radius: 8px; }
    .loading { background: #fff3e0; color: #ef6c00; }
    .error   { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <h2>fetch API로 사용자 목록 가져오기</h2>
  <button id="loadBtn">사용자 목록 불러오기</button>
  <div id="result"></div>

  <script>
    const btn    = document.getElementById('loadBtn');
    const result = document.getElementById('result');

    async function loadUsers() {
      btn.disabled = true;
      result.innerHTML = '<div class="loading">⏳ 불러오는 중...</div>';

      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const users = await res.json();
        result.innerHTML = users.map(u => `
          <div class="user">
            <div class="name">${u.name}</div>
            <div class="email">${u.email} • ${u.company.name}</div>
          </div>
        `).join('');
      } catch (err) {
        result.innerHTML = `<div class="error">❌ 오류: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', loadUsers);
  </script>
</body>
</html>
