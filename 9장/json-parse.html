<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>JSON 파싱</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    textarea { width: 100%; height: 120px; padding: 12px;
               font-family: monospace; font-size: 0.9rem;
               border: 1px solid #ddd; border-radius: 6px; }
    button { padding: 8px 16px; background: #2E75B6; color: white;
             border: none; border-radius: 6px; cursor: pointer;
             margin: 8px 4px 16px 0; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px;
          font-family: monospace; font-size: 0.85rem;
          white-space: pre-wrap; word-break: break-all; }
    .error { color: #c62828; background: #ffebee; }
  </style>
</head>
<body>
  <h2>JSON 파싱 실습</h2>
  <textarea id="input">{"name":"홍길동","age":30,"hobbies":["독서","코딩"]}</textarea>
  <div>
    <button onclick="doParse()">JSON.parse</button>
    <button onclick="doStringify()">예쁘게 출력</button>
  </div>
  <pre id="output">결과가 여기 표시됩니다.</pre>

  <script>
    const input  = document.getElementById('input');
    const output = document.getElementById('output');

    function doParse() {
      output.classList.remove('error');
      try {
        const obj = JSON.parse(input.value);
        output.textContent =
          'name: '    + obj.name +
          '\nage: '   + obj.age +
          '\nhobbies: ' + obj.hobbies.join(', ');
      } catch (err) {
        output.classList.add('error');
        output.textContent = '파싱 오류: ' + err.message;
      }
    }

    function doStringify() {
      try {
        const obj = JSON.parse(input.value);
        output.textContent = JSON.stringify(obj, null, 2);
        output.classList.remove('error');
      } catch (err) {
        output.classList.add('error');
        output.textContent = '파싱 오류: ' + err.message;
      }
    }
  </script>
</body>
</html>
