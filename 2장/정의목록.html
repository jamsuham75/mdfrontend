<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정의목록</title>
</head>
<body>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language. 웹 페이지의 구조를 만드는 언어.</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets. 웹 페이지의 스타일을 담당하는 언어.</dd>

        <dt>JavaScript</dt>
        <dd>웹 페이지에 동적인 기능을 추가하는 프로그래밍 언어.</dd>
    </dl>

    <!-- dl: definition list (정의 목록 전체 감싸기) -->
    <!-- dt: definition term (정의할 용어)          -->
    <!-- dd: definition description (용어 설명)     -->
</body>
</html>
