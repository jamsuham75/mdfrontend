    <!-- 저작권 표시 -->
    <footer>&copy; 2026 이창현코딩연구소. All rights reserved.</footer>

    <!-- 줄바꿈 없는 공백 (단어가 중간에 줄바꿈 되는 것을 방지) -->

</body>
</html>
