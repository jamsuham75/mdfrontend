<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서있는목록</title>
</head>
<body>
    <ol>
        <li>VS Code를 설치한다</li>
        <li>HTML 파일을 만든다</li>
        <li>느낌표(!)로 기본 구조를 생성한다</li>
        <li>Live Server로 실행한다</li>
    </ol>

    <!-- type 속성으로 번호 유형 변경 가능 -->
    <ol type="A">  <!-- A, B, C... -->
    <ol type="i">  <!-- i, ii, iii... (로마자 소문자) -->
    <ol start="5"> <!-- 5부터 시작 -->
</body>
</html>
