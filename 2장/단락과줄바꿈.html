<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>첫 번째 문단입니다. p 태그는 앞뒤에 자동으로 여백이 생깁니다.</p>
    <p>두 번째 문단입니다. 새로운 p 태그는 새 줄에서 시작됩니다.</p>

    <!-- 줄 바꿈만 필요할 때: br 태그 -->
    <p>첫 번째 줄<br>두 번째 줄<br>세 번째 줄</p>

    <!-- 주의: p 태그 안에서 Enter를 눌러도 줄바꿈이 되지 않는다! -->
    <p>이렇게 쓰면
        줄바꿈이 안 됩니다.</p>   <!-- 브라우저는 공백으로 처리 -->

    <!-- 수평 구분선: hr 태그 -->
    <hr>  <!-- 내용을 시각적으로 구분하는 선 -->
</body>
</html>
