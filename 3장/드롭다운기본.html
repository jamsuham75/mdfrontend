<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드롭다운기본</title>
</head>
<body>
    <select name="city">
        <option value=''>-- 도시를 선택하세요 --</option>  <!-- 안내 문구 옵션 -->
        <option value='seoul'>서울</option>
        <option value='busan'>부산</option>
        <option value='daegu' selected>대구</option>   <!-- 기본 선택 -->
        <option value='incheon'>인천</option>
        <option value='gwangju'>광주</option>
        <option value='daejeon' disabled>대전 (선택 불가)</option>
    </select>

    <!-- option의 value: 서버로 전달되는 실제 값 -->
    <!-- option 태그 사이 텍스트: 화면에 보이는 텍스트 -->
    <!-- selected: 기본으로 선택된 옵션 -->
    <!-- disabled: 선택은 보이지만 선택 불가 -->
</body>
</html>
