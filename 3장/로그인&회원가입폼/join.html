<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 — WebStudy</title>
</head>
<body>
  <main>
    <h1>회원가입</h1>

    <form id="joinForm" action="/api/join" method="POST" novalidate>

      <!-- ===== 개인 정보 그룹 ===== -->
      <fieldset>
        <legend>개인 정보</legend>

        <div class="form-group">
          <label for="name">이름 <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name"
            placeholder="실명을 입력하세요" maxlength="10"
            required aria-required="true">
        </div>

        <div class="form-group">
          <label for="birth">생년월일</label>
          <input type="date" id="birth" name="birth"
            min="1900-01-01" max="2025-12-31">
        </div>

        <div class="form-group">
          <label>성별</label>
          <label><input type="radio" name="gender" value="male"> 남성</label>
          <label><input type="radio" name="gender" value="female"> 여성</label>
          <label><input type="radio" name="gender" value="other"> 기타</label>
        </div>

        <div class="form-group">
          <label for="phone">전화번호</label>
          <input type="tel" id="phone" name="phone"
            placeholder="010-0000-0000"
            pattern="01[016789]-[0-9]{3,4}-[0-9]{4}"
            title="010-으로 시작하는 올바른 전화번호를 입력하세요">
        </div>
      </fieldset>

      <!-- ===== 계정 정보 그룹 ===== -->
      <fieldset>
        <legend>계정 정보</legend>

        <div class="form-group">
          <label for="joinId">아이디 <span aria-hidden="true">*</span></label>
          <input type="text" id="joinId" name="joinId"
            placeholder="영문+숫자 4~20자"
            pattern="[a-zA-Z0-9]{4,20}"
            title="영문과 숫자만 사용 가능하며 4자 이상 20자 이하"
            required aria-required="true"
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="joinEmail">이메일 <span aria-hidden="true">*</span></label>
          <input type="email" id="joinEmail" name="email"
            placeholder="example@email.com"
            required aria-required="true"
            autocomplete="email">
        </div>

        <div class="form-group">
          <label for="joinPw">비밀번호 <span aria-hidden="true">*</span></label>
          <input type="password" id="joinPw" name="pw"
            placeholder="영문+숫자+특수문자 8자 이상"
            minlength="8" maxlength="30"
            required aria-required="true"
            aria-describedby="pwGuide"
            autocomplete="new-password">
          <p id="pwGuide">영문, 숫자, 특수문자(@$!%*?)를 포함한 8자 이상</p>
        </div>

        <div class="form-group">
          <label for="joinPwCheck">비밀번호 확인 <span aria-hidden="true">*</span></label>
          <input type="password" id="joinPwCheck" name="pwCheck"
            placeholder="비밀번호를 다시 입력하세요"
            required aria-required="true"
            autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="joinRegion">거주 지역</label>
          <select id="joinRegion" name="region">
            <option value=''>-- 선택 --</option>
            <optgroup label="수도권">
              <option value='seoul'>서울</option>
              <option value='incheon'>인천</option>
              <option value='gyeonggi'>경기</option>
            </optgroup>
            <optgroup label="영남">
              <option value='busan'>부산</option>
              <option value='daegu'>대구</option>
            </optgroup>
          </select>
        </div>
      </fieldset>

      <!-- ===== 약관 동의 그룹 ===== -->
      <fieldset>
        <legend>약관 동의</legend>

        <label>
          <input type="checkbox" name="agreeAll" id="agreeAll">
          <strong>전체 동의</strong>
        </label>

        <label>
          <input type="checkbox" name="agreeTerms" id="agreeTerms" required>
          (필수) <a href="/terms" target="_blank">이용약관</a> 동의
        </label>

        <label>
          <input type="checkbox" name="agreePrivacy" id="agreePrivacy" required>
          (필수) <a href="/privacy" target="_blank">개인정보처리방침</a> 동의
        </label>

        <label>
          <input type="checkbox" name="agreeMarketing" id="agreeMarketing">
          (선택) 마케팅 정보 수신 동의
        </label>
      </fieldset>

      <!-- 가입 버튼 -->
      <button type="submit">가입하기</button>
      <a href="login.html">이미 계정이 있으신가요? 로그인</a>",

    </form>
  </main>
</body>
</html>
