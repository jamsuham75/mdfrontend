<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택계열</title>
</head>
<body>
    <!-- checkbox: 여러 개를 동시에 선택할 수 있음 -->
    <p>관심 분야를 모두 선택하세요:</p>
    <label><input type="checkbox" name="interest" value="html"> HTML</label>
    <label><input type="checkbox" name="interest" value="css"> CSS</label>
    <label><input type="checkbox" name="interest" value="js" checked> JavaScript</label>
    <!-- checked 속성: 기본으로 선택된 상태 -->

    <!-- radio: 같은 name 그룹 안에서 하나만 선택 가능 -->
    <p>성별을 선택하세요:</p>
    <label><input type="radio" name="gender" value="male"> 남성</label>
    <label><input type="radio" name="gender" value="female"> 여성</label>
    <label><input type="radio" name="gender" value="other"> 기타</label>

    <!-- 핵심: radio는 name 값이 같은 것끼리 그룹이 된다 -->
    <!-- 다른 그룹을 만들려면 name 값을 다르게 지정한다 -->

</body>
</html>
