<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날짜시간</title>
</head>
<body>
    <!-- date: 달력 UI로 날짜 선택 -->
    <input type="date" name="birthday" min="1900-01-01" max="2025-12-31">

    <!-- time: 시간 선택 UI -->
    <input type="time" name="apptTime" min="09:00" max="18:00">

    <!-- datetime-local: 날짜 + 시간 동시 선택 -->
    <input type="datetime-local" name="meeting">

    <!-- month: 연도+월 선택 -->
    <input type="month" name="expiry">

    <!-- week: 연도+주 선택 -->
    <input type="week" name="reportWeek">

</body>
</html>
