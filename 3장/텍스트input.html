<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- text: 가장 기본적인 한 줄 텍스트 입력 -->
    <input type="text" name="username" placeholder="이름을 입력하세요">

    <!-- password: 입력 내용을 **** 로 숨김 -->
    <input type="password" name="pw" placeholder="비밀번호 (8자 이상)">

    <!-- email: 제출 시 @ 포함 여부를 자동으로 검사 -->
    <input type="email" name="email" placeholder="example@email.com">

    <!-- number: 숫자만 입력 가능, min/max/step 속성 사용 가능 -->
    <input type="number" name="age" min="1" max="120" step="1" value="20">

    <!-- tel: 모바일에서 숫자 키패드를 자동으로 띄워줌 -->
    <input type="tel" name="phone" placeholder="010-0000-0000">

    <!-- url: http:// 또는 https:// 로 시작하는지 자동 검사 -->
    <input type="url" name="website" placeholder="https://example.com">

</body>
</html>
