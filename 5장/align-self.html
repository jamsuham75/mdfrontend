<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>align-self / order</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    .label { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    .row { display: flex; align-items: center; height: 120px; gap: 8px;
           background: #e8eaf6; border: 1px solid #9fa8da;
           border-radius: 6px; padding: 8px; margin-bottom: 12px; }
    .item { background: #3f51b5; color: white; padding: 10px 18px;
            border-radius: 4px; font-size: 0.85rem; }
    .self-start { align-self: flex-start; background: #e91e63; }
    .self-end   { align-self: flex-end;   background: #ff9800; }

    /* order 예시 */
    .order-row { display: flex; gap: 8px; }
    .o1 { order: 3; background: #2196f3; }
    .o2 { order: 1; background: #4caf50; }
    .o3 { order: 2; background: #ff9800; }
  </style>
</head>
<body>
  <p class="label">align-self — 개별 아이템 교차축 정렬</p>
  <div class="row">
    <div class="item">center (컨테이너)</div>
    <div class="item self-start">flex-start</div>
    <div class="item self-end">flex-end</div>
  </div>
  <p class="label">order — HTML 순서: 1→2→3, 시각 순서: 2→3→1</p>
  <div class="order-row">
    <div class="item o1">HTML 1번 (order:3)</div>
    <div class="item o2">HTML 2번 (order:1)</div>
    <div class="item o3">HTML 3번 (order:2)</div>
  </div>
</body>
</html>
