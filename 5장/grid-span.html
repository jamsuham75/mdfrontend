<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>grid-column / grid-row 셀 병합</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 80px;
      gap: 8px;
    }
    .item { border-radius: 6px; display: flex;
            align-items: center; justify-content: center;
            color: white; font-size: 0.85rem; font-weight: 600; }
    .a { background: #2E75B6; grid-column: 1 / 3; }  /* 2칸 가로 병합 */
    .b { background: #e53935; grid-row:    1 / 3; }  /* 2칸 세로 병합 */
    .c { background: #4caf50; }
    .d { background: #ff9800; }
    .e { background: #9c27b0; grid-column: 1 / -1; } /* 전체 너비 */
    .f { background: #607d8b; }
    .g { background: #795548; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item a">grid-column: 1/3 (2칸)</div>
    <div class="item b">grid-row: 1/3 (2행)</div>
    <div class="item c">일반</div>
    <div class="item d">일반</div>
    <div class="item f">일반</div>
    <div class="item g">일반</div>
    <div class="item e">grid-column: 1/-1 (전체 너비)</div>
  </div>
</body>
</html>
