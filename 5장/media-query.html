<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미디어 쿼리 — 모바일 퍼스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 16px; background: #f5f5f5; }

    .info {
      text-align: center; padding: 12px;
      background: #ff9800; color: white; border-radius: 6px;
      margin-bottom: 16px; font-weight: 700;
    }

    /* 기본(모바일): 1열 */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    /* 태블릿: 2열 */
    @media (min-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .info { background: #4caf50; }
    }
    /* 데스크톱: 3열 */
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .info { background: #2196f3; }
    }

    .card { background: white; border-radius: 8px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { font-size: 1rem; margin-bottom: 8px; color: #333; }
    .card p  { font-size: 0.875rem; color: #666; }
  </style>
</head>
<body>
  <div class="info">
    브라우저 너비를 조절하며 열 수가 바뀌는 것을 확인하세요!
  </div>
  <div class="grid">
    <div class="card"><h3>카드 1</h3><p>모바일: 1열 / 태블릿: 2열 / 데스크톱: 3열</p></div>
    <div class="card"><h3>카드 2</h3><p>모바일 퍼스트 반응형 그리드</p></div>
    <div class="card"><h3>카드 3</h3><p>min-width 미디어 쿼리 적용</p></div>
    <div class="card"><h3>카드 4</h3><p>배너 색상도 화면 크기에 따라 변합니다</p></div>
    <div class="card"><h3>카드 5</h3><p>600px 이상: 초록 / 1024px 이상: 파랑</p></div>
    <div class="card"><h3>카드 6</h3><p>viewport meta 태그 필수!</p></div>
  </div>
</body>
</html>
