<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>flex-wrap / gap</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    .label { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    .row { display: flex; background: #fff3e0; border: 1px solid #ffcc80;
           border-radius: 6px; padding: 8px; margin-bottom: 12px; }
    .item { background: #ff9800; color: white; width: 100px;
            padding: 12px; border-radius: 4px; text-align: center; }

    .no-wrap  { flex-wrap: nowrap; gap: 8px; }
    .do-wrap  { flex-wrap: wrap;   gap: 8px; }
  </style>
</head>
<body>
  <p class="label">flex-wrap: nowrap — 아이템이 넘쳐도 한 줄</p>
  <div class="row no-wrap">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div><div class="item">6</div>
  </div>
  <p class="label">flex-wrap: wrap — 공간 부족 시 줄바꿈 + gap: 8px</p>
  <div class="row do-wrap">
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div><div class="item">6</div>
  </div>
</body>
</html>
