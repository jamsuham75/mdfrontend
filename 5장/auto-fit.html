<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>auto-fit + minmax</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }
    .item {
      background: #7b1fa2; color: white;
      padding: 24px 16px; border-radius: 8px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item">카드 1</div>
    <div class="item">카드 2</div>
    <div class="item">카드 3</div>
    <div class="item">카드 4</div>
    <div class="item">카드 5</div>
  </div>
  <!-- 브라우저 너비를 조절하면 열 수가 자동으로 변한다 -->
</body>
</html>
