<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>flex-grow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    .label { font-size: 0.85rem; color: #555; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; background: #f3e5f5;
           border: 1px solid #ce93d8; border-radius: 6px;
           padding: 8px; margin-bottom: 12px; }
    .item { background: #9c27b0; color: white; padding: 12px;
            border-radius: 4px; text-align: center; font-size: 0.85rem; }

    /* flex-grow 비율 1:2:1 */
    .g1 { flex-grow: 1; }
    .g2 { flex-grow: 2; }

    /* flex: 1 — 모두 균등하게 */
    .equal { flex: 1; }

    /* 고정 + 유동 */
    .fixed  { flex: 0 0 120px; }  /* 120px 고정 */
    .fluid  { flex: 1; }          /* 나머지 차지 */
  </style>
</head>
<body>
  <p class="label">flex-grow: 1:2:1 비율</p>
  <div class="row">
    <div class="item g1">grow:1</div>
    <div class="item g2">grow:2</div>
    <div class="item g1">grow:1</div>
  </div>
  <p class="label">flex: 1 — 모두 균등</p>
  <div class="row">
    <div class="item equal">flex:1</div>
    <div class="item equal">flex:1</div>
    <div class="item equal">flex:1</div>
  </div>
  <p class="label">고정(120px) + 유동(나머지)</p>
  <div class="row">
    <div class="item fixed">고정 120px</div>
    <div class="item fluid">나머지 모두</div>
  </div>
</body>
</html>
